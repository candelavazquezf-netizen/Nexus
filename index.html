{title:'19. Finance English: balance sheet',level:'B2',time:'30 min',desc:'Assets, liabilities, equity and working capital.',theory:'A balance sheet presents assets, liabilities and equity at a specific date. Assets are resources controlled by the entity; liabilities are present obligations; equity is the residual interest. Current assets and current liabilities are generally associated with the operating cycle or near-term settlement. Working capital and liquidity ratios can help assess short-term financial flexibility, but must be interpreted with asset quality and industry context.',spanish:'Assets = activos; liabilities = pasivos; equity = patrimonio neto; accounts receivable = cuentas por cobrar; accounts payable = cuentas por pagar.',vocab:'current assets = activos corrientes · debt = deuda · cash = efectivo · inventory = inventario',example:'The company has increased its cash balance, but accounts receivable have also risen significantly.',source:'SEC — Beginner’s Guide to Financial Statements',url:'https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements'},
{title:'20. Finance English: cash flow and investment',level:'B2',time:'30 min',desc:'Operating cash flow, capex, free cash flow and returns.',theory:'Cash flow describes actual cash movements. Operating cash flow comes from core operations; investing cash flow includes capital expenditure and asset purchases or sales; financing cash flow includes borrowing, repayment and equity transactions. Free cash flow is often approximated as operating cash flow minus capital expenditure, although definitions vary. It is not identical to net income or EBITDA.',spanish:'Cash flow = flujo de caja; capital expenditure (capex) = inversión en activos; free cash flow = flujo de caja libre; return on investment = retorno sobre inversión.',vocab:'cash generated = efectivo generado · investment = inversión · payback period = plazo de recupero · forecast = proyección',example:'Operating cash flow remained positive, but higher capex reduced free cash flow this year.',source:'SEC — Financial statements',url:'https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements'},
{title:'21. Economics English: inflation, rates and exchange rates',level:'B2',time:'30 min',desc:'Read economic news and central-bank commentary.',theory:'Inflation measures changes in the general price level. Interest rates affect borrowing costs, saving incentives, bond valuations and demand. Exchange rates express the price of one currency in another. When reading an economic report, distinguish nominal values from real, inflation-adjusted values and identify the period, base year and methodology. A correlation between two variables does not prove that one caused the other.',spanish:'Inflation = inflación; policy rate = tasa de política monetaria; exchange rate = tipo de cambio; purchasing power = poder adquisitivo; real terms = en términos reales.',vocab:'tightening = endurecimiento monetario · easing = relajamiento · forecast = pronóstico · year-on-year = interanual',example:'The central bank kept rates unchanged, while annual inflation continued to decline.',source:'Bank of England — KnowledgeBank',url:'https://www.bankofengland.co.uk/knowledgebank'},
{title:'22. Technology English: databases and SQL',level:'B2',time:'35 min',desc:'Tables, queries, joins and data quality.',theory:'A relational database stores data in tables with rows and columns. A primary key uniquely identifies a row; a foreign key represents a relationship to another table. SQL is used to query and manipulate structured data. SELECT chooses columns, WHERE filters rows, GROUP BY aggregates categories, and JOIN combines related tables. Good technical communication specifies schema, data types, null behavior and assumptions.',spanish:'Database = base de datos; table = tabla; row = fila; column = columna; query = consulta; join = unión entre tablas.',vocab:'primary key = clave primaria · foreign key = clave foránea · null = valor ausente · aggregate = agregar/resumir',example:'SELECT basin, SUM(production) FROM wells GROUP BY basin; groups production totals by basin, assuming the table and fields exist.',source:'PostgreSQL — Documentation',url:'https://www.postgresql.org/docs/current/tutorial.html'},
{title:'23. Technology English: APIs and automation',level:'B2',time:'35 min',desc:'Requests, endpoints, JSON, authentication and errors.',theory:'An API defines how software systems exchange information. An endpoint identifies a resource or operation; HTTP methods such as GET and POST communicate intent. Responses often use JSON. Status codes indicate the result category, but the response body and API documentation determine the details. Authentication, authorization, rate limits, pagination, retries and data privacy must be considered in reliable integrations.',spanish:'Endpoint = punto de acceso; request = solicitud; response = respuesta; payload = contenido enviado; authentication = autenticación.',vocab:'timeout = tiempo agotado · rate limit = límite de solicitudes · credentials = credenciales · retry = reintentar',example:'A successful HTTP 200 response does not always mean that every business operation completed; inspect the returned status and payload.',source:'MDN — Overview of HTTP',url:'https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview'},
{title:'24. Oil & Gas English: exploration and production',level:'B2',time:'35 min',desc:'Understand industry news, reports and technical meetings.',theory:'Exploration evaluates the subsurface to identify possible hydrocarbon accumulations. Drilling creates a wellbore; completion prepares it for production; production brings fluids to the surface. A reservoir is the rock volume that stores and transmits fluids. Conventional reservoirs generally allow flow more readily than low-permeability shale formations, which may require horizontal drilling and hydraulic fracturing.',spanish:'Upstream = exploración y producción; wellbore = pozo perforado; reservoir = reservorio; drilling rig = equipo de perforación; crude oil = petróleo crudo.',vocab:'well = pozo · casing = cañería de revestimiento · flow rate = caudal · decline rate = tasa de declinación',example:'The operator completed the horizontal well and began monitoring its initial production rate.',source:'U.S. Energy Information Administration — Oil and petroleum products',url:'https://www.eia.gov/energyexplained/oil-and-petroleum-products/'},
{title:'25. Reading technical news critically',level:'C1',time:'25 min',desc:'Separate headline, evidence, analysis and opinion.',theory:'When reading industry news, identify the publication date, author, source documents and whether figures are estimates, targets or actual results. Compare the headline with the body. Check whether a percentage refers to month-on-month, year-on-year or cumulative change. Read quoted documents when possible and distinguish a company announcement from independent verification.',spanish:'La lectura crítica evita confundir anuncios, proyecciones y resultados observados. Confirmá unidades, período de comparación y origen de los datos.',vocab:'according to = según · estimate = estimación · outlook = perspectiva · source document = documento fuente',example:'“Investment will rise by 20%” may describe a company forecast, not a completed investment or audited result.',source:'Reuters — Handbook of Journalism',url:'https://www.reuters.com/'},
{title:'26. Writing a concise executive summary',level:'C1',time:'30 min',desc:'Communicate decisions, evidence, risk and next steps.',theory:'An executive summary should answer the question, state the key finding, present the strongest evidence, explain implications and recommend a next step. Put the conclusion first. Use precise numbers with units and dates; explain assumptions and uncertainty. A good summary is not merely a shorter report: it selects the information required for a decision.',spanish:'Orden recomendado: conclusión, evidencia, impacto, riesgos o limitaciones, recomendación y responsable/fecha.',vocab:'key finding = hallazgo clave · implication = implicancia · recommendation = recomendación · limitation = limitación',example:'Recommendation: defer the purchase until the supplier confirms delivery dates. The current schedule creates a two-week risk to commissioning.',source:'Purdue OWL — Professional writing',url:'https://owl.purdue.edu/owl/subject_specific_writing/professional_technical_writing/index.html'}
];

function updateProfile(){document.getElementById('topName').textContent=state.name||'Mi espacio de aprendizaje';document.getElementById('avatar').textContent=(state.name||'N').trim().charAt(0).toUpperCase()}
function allLessons(){return [...finance.map((x,i)=>({...x,id:'finance-'+i,course:'finance'})),...oilgas.map((x,i)=>({...x,id:'oilgas-'+i,course:'oilgas'})),...english.map((x,i)=>({...x,id:'english-'+i,course:'english'}))]}
function doneCount(course){return allLessons().filter(x=>(!course||x.course===course)&&state.done.includes(x.id)).length}function pct(course){let n=allLessons().filter(x=>!course||x.course===course).length;return n?Math.round(doneCount(course)/n*100):0}
function nav(page){currentPage=page;document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('sidebar').classList.remove('open');document.getElementById('crumb').textContent='Workspace / '+({home:'Inicio',finance:'Finanzas & Inversiones',oilgas:'Petróleo en Patagonia',english:'Technical English',news:'Noticias y actualidad',glossary:'Glosario',progress:'Mi progreso',admin:'Configuración'}[page]||page);render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)nav(b.dataset.page)});function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function render(){updateProfile();const app=document.getElementById('app');if(currentPage==='home')app.innerHTML=homePage();else if(['finance','oilgas','english'].includes(currentPage))app.innerHTML=coursePage(currentPage);else if(currentPage==='news')app.innerHTML=newsPage();else if(currentPage==='glossary')app.innerHTML=glossaryPage();else if(currentPage==='progress')app.innerHTML=progressPage();else if(currentPage==='admin')app.innerHTML=adminPage();else app.innerHTML=homePage()}
function homePage(){return `<section class="hero"><div class="eyebrow">Nexus learning environment · 2026</div><h1>Convertí conocimiento en criterio profesional.</h1><p>Una plataforma de aprendizaje para comprender las finanzas, la industria de hidrocarburos patagónica y el inglés técnico. Cada unidad combina teoría, ejemplos aplicados y fuentes para seguir investigando.</p><div class="hero-actions"><button class="btn btn-primary" onclick="nav('finance')">Explorar finanzas ↗</button><button class="btn btn-light" onclick="nav('oilgas')">Conocer la industria petrolera</button></div></section><div class="stats"><div class="stat"><div class="stat-label">Unidades disponibles</div><div class="stat-value">${allLessons().length}</div><div class="stat-foot">En tres academias</div></div><div class="stat"><div class="stat-label">Unidades completadas</div><div class="stat-value">${doneCount()}</div><div class="stat-foot">En este navegador</div></div><div class="stat"><div class="stat-label">Progreso global</div><div class="stat-value">${pct()}%</div><div class="progress-track"><div class="progress-fill" style="width:${pct()}%"></div></div></div><div class="stat"><div class="stat-label">Fuentes de consulta</div><div class="stat-value">30+</div><div class="stat-foot">Organismos y referencias técnicas</div></div></div><div class="section-title"><div><h2>Elegí tu academia</h2><p>Contenidos amplios, organizados por nivel y aplicación.</p></div></div><div class="grid3">${courseCard('finance','◈','Finanzas & Inversiones','Desde ordenar tus finanzas personales hasta analizar balances, acciones, bonos, CEDEARs y carteras.','#eeedff','16 unidades')}${courseCard('oilgas','♧','Petróleo en Patagonia','Geología, Golfo San Jorge, Vaca Muerta, maquinaria, producción, refinerías y economía petrolera.','#e0f7f7','14 unidades')}${courseCard('english','文','Technical English','Gramática, escritura profesional, vocabulario financiero, tecnología, APIs y Oil & Gas.','#fff0d9','26 unidades')}</div><div class="section-title"><div><h2>Continuá aprendiendo</h2><p>Accesos rápidos y fuentes útiles.</p></div></div><div class="two-col"><div class="card"><h3>Tu avance por academia</h3>${[['finance','Finanzas & Inversiones'],['oilgas','Petróleo en Patagonia'],['english','Technical English']].map(([id,n])=>`<div style="margin:17px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${n}</b><span>${pct(id)}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct(id)}%"></div></div></div>`).join('')}</div><div class="card"><h3>Fuentes destacadas</h3><div class="activity"><span class="dot"></span><div><strong>CNV — Educación al inversor</strong><small>Mercado de capitales, riesgos y recomendaciones.</small><br><a class="source" href="https://www.argentina.gob.ar/cnv" target="_blank" rel="noopener">Abrir fuente ↗</a></div></div><div class="activity"><span class="dot"></span><div><strong>IAPG — Industria petrolera</strong><small>Material técnico y contexto de la industria argentina.</small><br><a class="source" href="https://www.iapg.org.ar/" target="_blank" rel="noopener">Abrir fuente ↗</a></div></div><div class="activity"><span class="dot"></span><div><strong>British Council — English</strong><small>Gramática y práctica de inglés.</small><br><a class="source" href="https://learnenglish.britishcouncil.org/" target="_blank" rel="noopener">Abrir fuente ↗</a></div></div></div></div><div class="footer">Contenido educativo general. No constituye asesoramiento financiero, inversión recomendada ni procedimiento operativo para trabajos de campo. Verificá normativa, datos y condiciones vigentes en las fuentes originales.</div>`}
function courseCard(id,ico,title,desc,bg,units){return `<div class="card course"><div class="course-top"><div class="course-icon" style="background:${bg}">${ico}</div><span class="tag">${units}</span></div><h3>${title}</h3><p>${desc}</p><div class="progress-track"><div class="progress-fill" style="width:${pct(id)}%"></div></div><div class="course-bottom"><span>${doneCount(id)} completadas · ${pct(id)}%</span><button class="text-btn" onclick="nav('${id}')">Ingresar →</button></div></div>`}
function coursePage(id){let data=id==='finance'?finance:id==='oilgas'?oilgas:english;let title=id==='finance'?'Finanzas personales & análisis de inversiones':id==='oilgas'?'Industria petrolera de la Patagonia':'Technical English';let intro=id==='finance'?'Un recorrido desde el orden financiero personal hasta el análisis de empresas, valuación, instrumentos bursátiles y diseño de cartera. No es una recomendación de compra: el objetivo es aprender a evaluar información y riesgo.':id==='oilgas'?'Aprendé cómo se forma un yacimiento y cómo funciona la cadena petrolera patagónica: Golfo San Jorge, Cuenca Neuquina, equipos de campo, tratamiento, transporte y refinación.':'Un plan progresivo de A1 a C1 con gramática, vocabulario y comunicación profesional aplicada a finanzas, tecnología y petróleo.';return `<div class="page-header"><div class="eyebrow" style="color:var(--purple)">${id==='finance'?'ACADEMIA 01':id==='oilgas'?'ACADEMIA 02':'ACADEMIA 03'}</div><h1>${title}</h1><p>${intro}</p></div><div class="stats"><div class="stat"><div class="stat-label">Unidades del curso</div><div class="stat-value">${data.length}</div><div class="stat-foot">Teoría y ejemplos</div></div><div class="stat"><div class="stat-label">Completadas</div><div class="stat-value">${doneCount(id)}</div><div class="stat-foot">Tu progreso guardado</div></div><div class="stat"><div class="stat-label">Progreso</div><div class="stat-value">${pct(id)}%</div><div class="progress-track"><div class="progress-fill" style="width:${pct(id)}%"></div></div></div><div class="stat"><div class="stat-label">Modalidad</div><div class="stat-value" style="font-size:20px">Autoguiada</div><div class="stat-foot">Leé y marcá cada unidad</div></div></div><div class="toolbar"><input class="search" id="lessonSearch" placeholder="Buscar unidad, concepto o tema…" oninput="filterLessons('${id}')"><select class="filter" id="lessonFilter" onchange="filterLessons('${id}')"><option value="all">Todas las unidades</option><option value="pending">Pendientes</option><option value="done">Completadas</option></select><button class="btn btn-outline" onclick="expandAll('${id}',true)">Expandir todas</button><button class="btn btn-outline" onclick="expandAll('${id}',false)">Contraer todas</button></div><div class="unit-list" id="unitList">${data.map((x,i)=>lessonCard(x,id,i)).join('')}</div><div class="footer">Las fuentes externas se abren en otra pestaña. Algunas referencias son portales generales: utilizá su buscador interno para localizar la norma, guía o capítulo específico. El progreso se guarda en el almacenamiento local de este navegador.</div>`}
function lessonCard(x,id,i){let key=id+'-'+i,done=state.done.includes(key),open=!!expanded[key];return `<article class="lesson" data-key="${key}" data-search="${(x.title+' '+x.desc+' '+x.level+' '+(x.theory||'')+' '+(x.spanish||'')).toLowerCase()}"><div class="lesson-head" onclick="toggleLesson('${key}')"><div class="lesson-num" style="${done?'background:#e1f6ee;color:#16876c':''}">${done?'✓':String(i+1).padStart(2,'0')}</div><div class="lesson-main"><strong>${x.title}</strong><small>${x.desc}</small></div><span class="lesson-status">${x.level} · ${x.time}</span><span style="font-size:18px;color:#7c87a0">${open?'−':'+'}</span></div><div class="lesson-body" style="display:${open?'block':'none'}"><h4>Objetivo de aprendizaje</h4><p>${x.desc} Al finalizar, deberías poder explicar los conceptos principales, reconocer sus límites y aplicar el razonamiento a un ejemplo real.</p><h4>Desarrollo teórico</h4>${(x.theory||'').split('\n\n').map(p=>`<p>${p}</p>`).join('')}${x.spanish?`<h4>Explicación en español</h4><p>${x.spanish}</p><h4>Vocabulario clave</h4><p>${x.vocab}</p>`:''}<h4>Aplicación práctica</h4><div class="example">${x.example||''}</div><h4>Ideas que conviene retener</h4><ul>${(x.points||['Comprendé la definición y sus límites.','Aplicá el concepto a un caso concreto.','Consultá la fuente original para profundizar.']).map(p=>`<li>${p}</li>`).join('')}</ul><h4>Fuente para seguir leyendo</h4><p>La teoría de esta unidad se apoya en el recurso enlazado. Abrilo para consultar material adicional y verificar definiciones o actualizaciones.</p><a class="source" href="${x.url}" target="_blank" rel="noopener">↗ ${x.source} — abrir recurso</a><div class="quiz"><strong>Chequeo de comprensión</strong><p style="font-size:12px;color:var(--muted)">¿Cuál es la mejor forma de continuar después de esta unidad?</p><label><input type="radio" name="q-${key}" value="0"> Memorizar solo el título y avanzar.</label><label><input type="radio" name="q-${key}" value="1"> Explicar el concepto con tus palabras, revisar el ejemplo y consultar la fuente.</label><label><input type="radio" name="q-${key}" value="2"> Tomar una decisión real sin revisar datos ni riesgos.</label><button class="btn btn-outline" onclick="checkQuiz('${key}')">Comprobar respuesta</button><span class="quiz-result" id="result-${key}"></span></div><div class="done-row"><button class="btn ${done?'btn-outline':'btn-primary'}" onclick="markDone('${key}')">${done?'✓ Unidad completada · desmarcar':'Marcar unidad como completada'}</button><span class="muted">Tu avance se guarda localmente.</span></div></div></article>`}
function toggleLesson(key){expanded[key]=!expanded[key];let el=document.querySelector(`[data-key="${key}"] .lesson-body`);if(el)el.style.display=expanded[key]?'block':'none';let head=document.querySelector(`[data-key="${key}"] .lesson-head span:last-child`);if(head)head.textContent=expanded[key]?'−':'+'}
function expandAll(id,on){let data=id==='finance'?finance:id==='oilgas'?oilgas:english;data.forEach((x,i)=>expanded[id+'-'+i]=on);render()}
function filterLessons(id){let q=(document.getElementById('lessonSearch')?.value||'').toLowerCase(),f=document.getElementById('lessonFilter')?.value||'all';document.querySelectorAll('#unitList .lesson').forEach(el=>{let isDone=state.done.includes(el.dataset.key);el.style.display=(!q||el.dataset.search.includes(q))&&(f==='all'||(f==='done'&&isDone)||(f==='pending'&&!isDone))?'':'none'})}
function markDone(key){if(state.done.includes(key))state.done=state.done.filter(x=>x!==key);else state.done.push(key);save();render()}
function checkQuiz(key){let checked=document.querySelector(`input[name="q-${key}"]:checked`),r=document.getElementById('result-'+key);if(!checked){r.textContent='Elegí una opción.';r.style.color='#b36b00';return}let ok=checked.value==='1';r.textContent=ok?'Correcto: comprensión + aplicación + fuentes.':'Volvé a revisar la teoría y la fuente.';r.style.color=ok?'#16876c':'#b84a4a'}
function newsPage(){return `<div class="page-header"><div class="eyebrow" style="color:var(--purple)">RADAR DE INFORMACIÓN</div><h1>Noticias y actualidad</h1><p>Selección de portales y notas de referencia para seguir petróleo y energía, finanzas y tecnología. Los enlaces abren publicaciones originales en una pestaña nueva. Las notas con fecha se muestran como referencia de publicación; los portales generales permiten consultar novedades posteriores.</p></div><div class="toolbar"><input class="search" id="newsSearch" placeholder="Buscar noticia, tema o fuente…" oninput="filterNews()"><select class="filter" id="newsFilter" onchange="filterNews()"><option value="all">Todos los temas</option><option>Petróleo y energía</option><option>Finanzas</option><option>Tecnología</option></select></div><div class="news-grid" id="newsGrid">${news.map(n=>`<article class="news-item" data-cat="${n.cat}" data-search="${(n.title+' '+n.desc+' '+n.source+' '+n.cat).toLowerCase()}"><div class="news-meta"><span class="news-cat">${n.cat}</span><span class="news-date">${n.date}</span></div><h3>${n.title}</h3><p>${n.desc}</p><div class="muted" style="margin-bottom:12px">Fuente: ${n.source}</div><a class="source" href="${n.url}" target="_blank" rel="noopener">Leer publicación ↗</a></article>`).join('')}</div><div class="footer"><b>Nota sobre actualidad:</b> esta versión contiene una selección inicial de enlaces y portales, no un feed conectado en tiempo real. Para noticias de último momento, abrí los portales y comprobá la fecha y el contenido de cada publicación antes de utilizar sus datos.</div>`}
function filterNews(){let q=(document.getElementById('newsSearch')?.value||'').toLowerCase(),f=document.getElementById('newsFilter')?.value||'all';document.querySelectorAll('#newsGrid .news-item').forEach(el=>el.style.display=(!q||el.dataset.search.includes(q))&&(f==='all'||el.dataset.cat===f)?'':'none')}
function glossaryPage(){return `<div class="page-header"><h1>Glosario profesional</h1><p>Conceptos esenciales de finanzas, petróleo y tecnología. Usá el buscador para encontrar definiciones rápidas.</p></div><div class="toolbar"><input class="search" id="termSearch" placeholder="Buscar término…" oninput="filterTerms()"></div><div class="glossary-grid" id="terms">${glossary.map(([t,d])=>`<div class="term" data-search="${(t+' '+d).toLowerCase()}"><b>${t}</b><span>${d}</span></div>`).join('')}</div>`}
function filterTerms(){let q=(document.getElementById('termSearch')?.value||'').toLowerCase();document.querySelectorAll('#terms .term').forEach(el=>el.style.display=el.dataset.search.includes(q)?'':'none')}
function progressPage(){return `<div class="page-header"><h1>Mi progreso</h1><p>Seguimiento de unidades completadas en este navegador. Podés avanzar a tu ritmo y volver a abrir cada unidad.</p></div><div class="stats"><div class="stat"><div class="stat-label">Total completado</div><div class="stat-value">${doneCount()} / ${allLessons().length}</div><div class="progress-track"><div class="progress-fill" style="width:${pct()}%"></div></div></div><div class="stat"><div class="stat-label">Finanzas</div><div class="stat-value">${pct('finance')}%</div><div class="stat-foot">${doneCount('finance')} de ${finance.length}</div></div><div class="stat"><div class="stat-label">Petróleo Patagonia</div><div class="stat-value">${pct('oilgas')}%</div><div class="stat-foot">${doneCount('oilgas')} de ${oilgas.length}</div></div><div class="stat"><div class="stat-label">Technical English</div><div class="stat-value">${pct('english')}%</div><div class="stat-foot">${doneCount('english')} de ${english.length}</div></div></div><div class="card"><h3>Avance por academia</h3>${[['finance','Finanzas & Inversiones'],['oilgas','Petróleo en Patagonia'],['english','Technical English']].map(([id,n])=>`<div class="progress-row"><b>${n}</b><div class="progress-track"><div class="progress-fill" style="width:${pct(id)}%"></div></div><span>${pct(id)}%</span></div>`).join('')}<p class="muted">El progreso se almacena en localStorage. Si abrís el archivo en otro navegador o dispositivo, no se sincronizará automáticamente.</p><button class="btn btn-outline" onclick="if(confirm('¿Querés borrar todo tu progreso?')){state.done=[];save();render()}">Reiniciar progreso</button></div>`}
function adminPage(){return `<div class="page-header"><h1>Configuración</h1><p>Personalizá tu perfil local. No se envían datos a ningún servidor; todo queda en este navegador.</p></div><div class="admin-grid"><div class="card"><h3>Perfil de aprendizaje</h3><div class="field"><label>Nombre visible</label><input id="profileName" value="${esc(state.name||'')}" placeholder="Tu nombre"></div><div class="field"><label>Rol o área</label><input id="profileRole" value="${esc(state.role||'')}" placeholder="Ej. Analista / Operaciones"></div><button class="btn btn-primary" onclick="saveProfile()">Guardar perfil</button></div><div class="card"><h3>Apariencia</h3><p class="muted">Elegí colores de acento para la interfaz.</p><div class="color-fields"><div class="field"><label>Violeta</label><input type="color" id="colorPurple" value="${state.colors?.purple||'#6558d3'}"></div><div class="field"><label>Turquesa</label><input type="color" id="colorCyan" value="${state.colors?.cyan||'#2cb9c8'}"></div></div><button class="btn btn-primary" onclick="saveColors()">Aplicar colores</button><button class="btn btn-outline" onclick="resetColors()">Restablecer</button></div><div class="card"><h3>Datos y privacidad</h3><p class="muted">Las unidades completadas y el perfil se guardan únicamente en el almacenamiento local del navegador. Borrar datos del sitio puede eliminar el progreso.</p><button class="btn btn-outline" onclick="exportProgress()">Exportar progreso JSON</button></div><div class="card"><h3>Acerca del contenido</h3><p class="muted">Material introductorio y educativo. Las fuentes externas pueden actualizarse o cambiar de dirección. Consultá siempre la documentación original y las reglas vigentes antes de tomar decisiones financieras u operativas.</p><button class="btn btn-outline" onclick="nav('news')">Ir a noticias ↗</button></div></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveProfile(){state.name=document.getElementById('profileName').value.trim()||'Estudiante';state.role=document.getElementById('profileRole').value.trim()||'Aprendizaje profesional';save();render()}
function saveColors(){state.colors={purple:document.getElementById('colorPurple').value,cyan:document.getElementById('colorCyan').value};document.documentElement.style.setProperty('--purple',state.colors.purple);document.documentElement.style.setProperty('--cyan',state.colors.cyan);save()}
function resetColors(){state.colors={purple:'#6558d3',cyan:'#2cb9c8'};save();render();document.documentElement.style.setProperty('--purple',state.colors.purple);document.documentElement.style.setProperty('--cyan',state.colors.cyan)}
function exportProgress(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus-academy-progress.json';a.click();URL.revokeObjectURL(url)}
if(state.colors){document.documentElement.style.setProperty('--purple',state.colors.purple||'#6558d3');document.documentElement.style.setProperty('--cyan',state.colors.cyan||'#2cb9c8')}render();
</script></body></html>
