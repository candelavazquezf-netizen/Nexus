ght:900;font-size:12px;flex-shrink:0}.lesson-main{flex:1;min-width:0}.lesson-main strong{font-size:14px;display:block}.lesson-main small{color:var(--muted);font-size:11px;display:block;margin-top:5px}.lesson-status{font-size:11px;color:var(--muted);white-space:nowrap}.lesson-body{padding:0 22px 23px 67px;border-top:1px solid var(--line)}.lesson-body h4{font-size:13px;margin:22px 0 7px;color:#3f4380}.lesson-body p,.lesson-body li{font-size:13px;line-height:1.85;color:#465169}.lesson-body ul{padding-left:20px}.lesson-body .example{padding:13px 15px;background:#f4f6fb;border-left:3px solid var(--cyan);border-radius:5px;font-size:12px;line-height:1.8}.source{display:inline-flex;align-items:center;gap:7px;color:#5147b6;font-size:12px;font-weight:800;text-decoration:none;margin:7px 0 4px}.source:hover{text-decoration:underline}.quiz{margin-top:17px;padding:15px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px}.quiz strong{font-size:12px}.quiz label{display:block;font-size:12px;padding:8px 0;color:#4c566c}.quiz button{margin-top:7px}.quiz-result{font-size:12px;font-weight:700;margin-left:10px}.done-row{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.check{accent-color:var(--purple)}.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.news-item{padding:19px;display:flex;flex-direction:column;min-height:230px}.news-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.news-cat{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:900;color:#5b50bb}.news-date{font-size:10px;color:var(--muted)}.news-item h3{font-size:15px;line-height:1.45;margin:0 0 9px}.news-item p{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 15px}.news-item a{margin-top:auto}.glossary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.term{padding:15px;background:#fff;border:1px solid var(--line);border-radius:10px}.term b{font-size:13px;display:block;margin <body><div class="layout"><aside id="sidebar"><div class="brand"><div class="logo">N</div><div><strong>NEXUS ACADEMY</strong><small>LEARNING PLATFORM</small></div></div><nav class="nav" id="nav"><div class="nav-label">Workspace</div><button class="active" data-page="home"><span class="ico">⌂</span>Inicio</button><div class="nav-label">Academias</div><button data-page="finance"><span class="ico">◈</span>Finanzas & Inversiones</button><button data-page="oilgas"><span class="ico">♧</span>Petróleo en Patagonia</button><button data-page="english"><span class="ico">文</span>Technical English</button><div class="nav-label">Explorar</div><button data-page="news"><span class="ico">↗</span>Noticias y actualidad</button><button data-page="glossary"><span class="ico">▤</span>Glosario</button><button data-page="progress"><span class="ico">◔</span>Mi progreso</button><div class="nav-label">Personalización</div><button data-page="admin"><span class="ico">⚙</span>Configuración</button></nav><div class="side-note"><b>Aprendizaje con fuentes</b>Cada unidad incluye lecturas y recursos externos para profundizar. El progreso se guarda en este navegador.</div></aside><main><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" onclick="toggleMenu()">☰</button><span class="crumb" id="crumb">Workspace / Inicio</span></div><div class="profile-pill"><div class="avatar" id="avatar">N</div><span id="topName">Mi espacio de aprendizaje</span></div></header><div class="content" id="app"></div></main></div>
<script>
const finance=[
{title:'1. Finanzas personales: diagnóstico y objetivos',level:'Fundamentos',time:'25 min',desc:'Construí un mapa realista de tu situación financiera.',theory:`Las finanzas personales consisten en asignar recursos limitados entre consumo presente, ahorro, protección frente a imprevistos e inversión futura. No empiezan eligiendo una acción: empiezan entendiendo ingresos, gastos, deudas, activos y obligaciones. Un diagnóstico financiero separa los flujos mensuales (lo que entra y sale) del patrimonio (lo que poseés menos lo que debés).\n\nEl primer paso es registrar ingresos netos y clasificar gastos en esenciales, discrecionales y extraordinarios. Conviene observar al menos tres meses para detectar estacionalidad. Luego se definen objetivos SMART: concretos, medibles, alcanzables, relevantes y con plazo. Un fondo para mudanza a 18 meses no debería gestionarse igual que una jubilación a 25 años, porque el horizonte y la tolerancia a pérdidas son diferentes.\n\nUn presupuesto no es una prohibición: es una decisión anticipada sobre el uso del dinero. La diferencia entre ingreso y gasto permite calcular capacidad de ahorro. Si el saldo es negativo, invertir sin resolverlo puede obligarte a vender activos en mal momento.`,points:['Calculá patrimonio neto: activos menos pasivos.','Medí tasa de ahorro: ahorro mensual / ingreso neto.','Separá objetivos de corto, mediano y largo plazo.'],example:'Ejemplo: ingreso neto $1.500.000, gastos esenciales $750.000, discrecionales $400.000 y cuotas $150.000. El excedente es $200.000; antes de asumir riesgo bursátil, evaluá fondo de emergencia y costo de deuda.',source:'CNV — Recomendaciones al inversor',url:'https://www.argentina.gob.ar/cnv/proteccion-al-inversor/recomendaciones-al-inversor'},
{title:'2. Presupuesto, ahorro y fondo de emergencia',level:'Fundamentos',time:'20 min',desc:'Convertí el ahorro en un sistema sostenible.',theory:`El ahorro es la parte del ingreso que no se consume en el período. Para que no dependa de la voluntad al final del mes, puede automatizarse al recibir el ingreso: primero se asigna una suma a objetivos y después se organiza el gasto restante. Las reglas porcentuales (como 50/30/20) sirven como punto de partida, no como ley universal; alquiler, inflación, composición familiar y nivel de ingresos cambian las proporciones posibles.\n\nEl fondo de emergencia es una reserva líquida destinada a cubrir eventos como pérdida de empleo, reparaciones, gastos médicos o interrupciones de ingresos. Como referencia, muchas planificaciones consideran entre tres y seis meses de gastos esenciales; trabajadores independientes o con ingresos volátiles pueden necesitar más. La prioridad es disponibilidad y bajo riesgo, no maximizar rendimiento.\n\nNo todo saldo bancario es equivalente: hay que considerar liquidez, garantías aplicables, moneda, inflación y riesgo de contraparte. El fondo de emergencia no debería depender de vender acciones que pueden caer justo cuando aparece la necesidad.`,points:['Calculá meses de cobertura: fondo / gastos esenciales mensuales.','Separá ahorro de emergencia del dinero destinado a invertir.','Revisá la reserva cuando cambian ingresos, alquiler o dependientes.'],example:'Si tus gastos esenciales son $650.000 por mes, una reserva de 4 meses equivale a $2.600.000. Es un objetivo de planificación, no una cifra obligatoria para todas las personas.',source:'Banco Central de la República Argentina — Educación financiera',url:'https://www.bcra.gob.ar/BCRAyVos/Educacion_Financiera.asp'},
{title:'3. Deudas, tarjetas y costo financiero total',level:'Fundamentos',time:'30 min',desc:'Compará tasas, cuotas y costo real del crédito.',theory:`Una deuda permite anticipar consumo o inversión, pero compromete ingresos futuros. Para comparar préstamos no alcanza con mirar la cuota: hay que analizar el Costo Financiero Total (CFT), que incorpora tasa, comisiones, seguros y otros cargos según corresponda. La Tasa Nominal Anual (TNA), la Tasa Efectiva Anual (TEA) y el CFT no son intercambiables. La TEA refleja capitalización; el CFT procura representar el costo total para el cliente. Revisá siempre la metodología y las condiciones contractuales.\n\nLas tarjetas pueden tener distintos costos para compras en cuotas, financiación del resumen, adelantos y mora. Pagar el mínimo suele trasladar saldo y generar intereses. Para priorizar deudas, el método avalancha dirige pagos adicionales a la deuda con mayor tasa; el método bola de nieve cancela primero el saldo menor para generar motivación. Desde un punto de vista matemático, la avalancha normalmente reduce el interés total, siempre que se mantengan los pagos mínimos de las demás deudas.\n\nTomar deuda para invertir apalanca tanto ganancias como pérdidas. Si el rendimiento de la inversión no supera el costo efectivo de la deuda, la operación destruye valor, y además puede haber riesgo de liquidez y de variación de tasas.`,points:['Compará CFT, plazo, penalidades y costo de cancelación anticipada.','No evalúes asequibilidad solo por la cuota inicial.','Evitá endeudarte para especular con activos volátiles.'],example:'Un crédito con cuota baja y plazo largo puede terminar costando más que otro con cuota superior. Pedí el cuadro de amortización y sumá todos los pagos para entender el costo total.',source:'BCRA — Usuarios financieros',url:'https://www.bcra.gob.ar/BCRAyVos/Usuarios_Financieros.asp'},
{title:'4. Inflación, tasas de interés y poder adquisitivo',level:'Fundamentos',time:'25 min',desc:'Entendé el rendimiento nominal y el rendimiento real.',theory:`La inflación es el aumento sostenido del nivel general de precios; reduce la cantidad de bienes y servicios que puede comprar una suma fija de dinero. La tasa nominal expresa el crecimiento monetario, mientras que la tasa real intenta medir el cambio de poder adquisitivo. Una aproximación común es tasa real ≈ tasa nominal − inflación; una fórmula más precisa es (1 + tasa nominal)/(1 + inflación) − 1.\n\nLas tasas de interés influyen en el costo del crédito, el atractivo relativo de instrumentos de renta fija, el consumo, la inversión y las valuaciones de activos. Si suben las tasas de mercado, los bonos ya emitidos con cupones fijos suelen bajar de precio para ofrecer un rendimiento competitivo. La magnitud del movimiento depende, entre otras cosas, de la duración y de la estructura de flujos.\n\nEn Argentina también importa la moneda de los ingresos y de los objetivos. Un ahorro en pesos para un gasto en pesos de corto plazo tiene una exposición diferente de un objetivo dolarizado. La cobertura cambiaria no es gratis ni garantiza ganancias: el tipo de cambio, la inflación local y externa y las regulaciones pueden moverse de manera distinta.`,points:['Distinguí tasa nominal, efectiva y real.','Compará rendimientos netos de impuestos, costos e inflación.','Alineá la moneda de la inversión con la obligación futura cuando sea razonable.'],example:'Con rendimiento nominal de 40% e inflación de 30%, la aproximación da 10% real; la fórmula exacta da aproximadamente 7,7%. Son números ilustrativos, no una previsión.',source:'INDEC — Índice de precios al consumidor',url:'https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-5-31'},
{title:'5. Interés compuesto y valor del tiempo',level:'Fundamentos',time:'20 min',desc:'Cómo crece una inversión y por qué importan el plazo y los costos.',theory:`El interés compuesto ocurre cuando los rendimientos se reinvierten y comienzan a generar nuevos rendimientos. Para un capital inicial P, una tasa por período r y n períodos, el valor futuro teórico es P(1+r)^n. Esta expresión supone una tasa constante y reinversión, condiciones que rara vez se cumplen exactamente en inversiones reales. En instrumentos con volatilidad, la secuencia de rendimientos importa y el resultado no equivale a multiplicar por una tasa promedio simple.\n\nEl tiempo puede favorecer al inversor porque permite reinvertir, pero no elimina el riesgo de pérdida. Los costos también se acumulan: una comisión anual pequeña puede producir una diferencia importante en horizontes largos. Por eso deben compararse rendimientos netos, impuestos y gastos, no solo el rendimiento bruto anunciado.\n\nLas aportaciones periódicas ayudan a crear disciplina. Invertir una suma fija regularmente reduce la dependencia de acertar un único momento de entrada, pero no garantiza beneficios ni evita pérdidas. La decisión debe partir del objetivo, el horizonte, la liquidez necesaria y la tolerancia al riesgo.`,points:['Usá escenarios conservador, base y optimista, no una única cifra.','Incluí costos y posibles impuestos en la proyección.','No confundas una simulación matemática con una promesa de rentabilidad.'],example:'$100.000 al 5% efectivo anual durante 10 años se convertirían en unos $162.889 antes de costos e impuestos, si esa tasa se mantuviera todos los años.',source:'Investor.gov — Compound Interest Calculator',url:'https://www.investor.gov/financial-tools-calculators/calculators/compound-interest-calculator'},
{title:'6. Cómo funciona la bolsa y cómo empezar a invertir',level:'Mercados',time:'30 min',desc:'Mercado primario, secundario, intermediarios y cuenta comitente.',theory:`El mercado de capitales conecta a quienes necesitan financiamiento con quienes desean invertir. En el mercado primario, una emisora coloca valores y recibe fondos; en el secundario, los inversores intercambian valores previamente emitidos. La negociación secundaria aporta referencias de precios y liquidez, aunque no asegura que siempre haya compradores a un precio conveniente.\n\nEn Argentina, la CNV regula y supervisa la oferta pública y a los participantes sujetos a su control. Antes de operar, verificá que el agente esté registrado, comprendé las comisiones, los plazos de liquidación, la custodia, las modalidades de órdenes y los riesgos. Una cuenta comitente permite operar con instrumentos del mercado; no debe confundirse con una cuenta bancaria común.\n\nUna orden a mercado prioriza ejecutar, pero el precio final puede variar, especialmente en activos poco líquidos. Una orden limitada fija el precio máximo de compra o mínimo de venta, aunque puede no ejecutarse. El spread entre compra y venta, el volumen operado y la profundidad del mercado afectan el costo real de entrar y salir.`,points:['Verificá al agente en los registros públicos de la CNV.','Leé el prospecto y los hechos relevantes del emisor.','Entendé tipo de orden, plazo de liquidación, custodia y comisiones.'],example:'Antes de comprar un activo, anotá por qué lo comprás, cuánto tiempo pensás mantenerlo, qué dato invalidaría tu hipótesis y qué pérdida podrías tolerar.',source:'CNV — ¿Qué es el mercado de capitales?',url:'https://www.argentina.gob.ar/cnv/que-es-el-mercado-de-capitales'},
{title:'7. Acciones: qué comprás y de dónde surge el retorno',level:'Mercados',time:'35 min',desc:'Participación societaria, dividendos, precio y volatilidad.',theory:`Una acción representa una participación en el capital de una empresa. El accionista puede beneficiarse de la apreciación del precio y, si la compañía declara dividendos, de distribuciones de ganancias. No existe obligación general de pagar dividendos: una empresa puede reinvertir beneficios, acumular caja o atravesar pérdidas. El precio de mercado refleja expectativas sobre flujos futuros, riesgos, tasas y condiciones generales, no solo el resultado del último trimestre.\n\nEl retorno total combina variación de precio y distribuciones recibidas, ajustadas por costos e impuestos. Una acción puede ser una buena empresa y aun así resultar una mala inversión si se compra a un precio que incorpora expectativas excesivas. Por eso se distingue calidad del negocio de valuación del activo.\n\nRiesgos relevantes incluyen competencia, deuda, cambios regulatorios, concentración de clientes, exposición cambiaria, ciclos económicos, gobierno corporativo y liquidez. La diversificación entre sectores y emisores reduce ciertos riesgos específicos, pero no elimina caídas generales del mercado.`,points:['Analizá modelo de negocio, ventajas competitivas y asignación de capital.','Leé balances y comunicaciones al mercado; no te guíes solo por redes sociales.','Considerá valuación y escenario adverso antes de comprar.'],example:'Una empresa que aumenta ventas pero también deuda, diluye accionistas y consume caja no necesariamente mejora su valor económico. Hay que estudiar cómo se financia el crecimiento.',source:'Investor.gov — Stocks',url:'https://www.investor.gov/introduction-investing/investing-basics/investment-products/stocks'},
{title:'8. Leer un balance: estado de situación patrimonial',level:'Análisis de empresas',time:'40 min',desc:'Activos, pasivos, patrimonio neto y liquidez.',theory:`El estado de situación patrimonial muestra, a una fecha determinada, los recursos de la empresa (activos), sus obligaciones (pasivos) y la participación residual de los propietarios (patrimonio neto). La identidad contable básica es Activos = Pasivos + Patrimonio neto. Los activos corrientes suelen convertirse en efectivo o consumirse en el ciclo operativo; los no corrientes incluyen, por ejemplo, instalaciones y equipos. La clasificación exacta depende de las normas contables aplicables.\n\nEl capital de trabajo neto suele calcularse como activo corriente menos pasivo corriente. El ratio corriente (activo corriente/pasivo corriente) da una señal general sobre cobertura de obligaciones de corto plazo, pero no basta: inventarios lentos o cuentas por cobrar difíciles pueden inflar el numerador. Por eso conviene revisar calidad de activos, vencimientos, concentración de clientes y disponibilidad real de caja.\n\nEl patrimonio neto no equivale al precio bursátil. El valor contable refleja criterios contables y costos históricos o mediciones específicas; la capitalización de mercado es precio de acción multiplicado por acciones en circulación. En empresas intensivas en activos, la calidad, edad y utilización de plantas y equipos pueden ser determinantes.`,points:['Compará al menos tres años y empresas comparables.','Revisá deuda de corto y largo plazo, caja restringida y contingencias.','Buscá notas explicativas: suelen contener riesgos que el titular del balance no muestra.'],example:'Si activo corriente = 900 y pasivo corriente = 600, el ratio corriente es 1,5. No significa automáticamente que la empresa sea sólida: hay que evaluar composición y vencimientos.',source:'IFRS — Conceptual Framework and financial statements',url:'https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/'},
{title:'9. Estado de resultados: ventas, márgenes y ganancias',level:'Análisis de empresas',time:'35 min',desc:'Cómo leer la rentabilidad operativa y neta.',theory:`El estado de resultados resume ingresos, costos y gastos durante un período. Las ventas muestran el volumen facturado según criterios contables; el costo de ventas se relaciona con los bienes o servicios vendidos. La diferencia genera utilidad bruta. Luego se consideran gastos comerciales, administrativos, investigación, depreciación y otros conceptos para llegar a resultados operativos y finalmente al resultado neto, incluyendo efectos financieros e impuestos. La presentación exacta depende de la norma y del sector.\n\nEl margen bruto (utilidad bruta/ventas) ayuda a entender poder de precios y costos directos. El margen operativo mide cuánto queda tras gastos operativos; el margen neto incluye el efecto financiero e impositivo. Una compañía puede aumentar ingresos y, al mismo tiempo, reducir márgenes si sus costos crecen más rápido. En economías inflacionarias, comparar cifras nominales sin ajustes ni contexto puede inducir a error.\n\nLa depreciación distribuye contablemente el costo de ciertos activos durante su vida útil; no es una salida de caja del período, aunque representa consumo económico de activos. EBITDA suele aproximar resultado antes de intereses, impuestos, depreciación y amortización, pero no es flujo de caja libre y puede ocultar necesidades de inversión y capital de trabajo.`,points:['Observá crecimiento de ventas junto con evolución de márgenes.','Separá resultado recurrente de ganancias o pérdidas extraordinarias.','Compará indicadores con compañías del mismo sector.'],example:'Si ventas pasan de 1.000 a 1.200 y utilidad operativa de 150 a 144, los ingresos crecen 20%, pero el margen cae de 15% a 12%. El crecimiento no se tradujo en más rentabilidad operativa.',source:'SEC — Beginners’ Guide to Financial Statements',url:'https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements'},
{title:'10. Flujo de caja: la diferencia entre ganar y cobrar',level:'Análisis de empresas',time:'40 min',desc:'Flujo operativo, inversión y financiación.',theory:`El estado de flujo de efectivo clasifica entradas y salidas de caja en actividades operativas, de inversión y de financiación. El flujo operativo informa cuánto efectivo genera el negocio principal; inversión incluye compra y venta de activos productivos y ciertas inversiones; financiación refleja deuda, aportes de capital, dividendos y recompras, según las reglas aplicables. Una empresa puede declarar ganancias contables y tener problemas de caja si vende a crédito, acumula inventario o debe invertir mucho para sostener la operación.\n\nEl flujo de caja libre suele estimarse como flujo operativo menos inversiones de capital (capex), aunque existen definiciones alternativas. Es útil para evaluar capacidad de pagar deuda, dividendos o financiar crecimiento sin recurrir continuamente a capital externo. Sin embargo, el capex puede ser irregular: conviene distinguir inversión de mantenimiento de inversión de expansión y revisar varios años.\n\nLa conversión de ganancias en efectivo y el capital de trabajo son señales importantes. Un aumento persistente de cuentas por cobrar más rápido que las ventas puede indicar cobros más lentos; inventarios crecientes pueden anticipar demanda débil o compras estratégicas. Ninguna señal aislada prueba un problema, pero orienta preguntas.`,points:['Compará beneficio neto, flujo operativo y flujo libre.','Revisá capex y necesidades de capital de trabajo.','Observá si la empresa se financia con deuda para cubrir déficits recurrentes.'],example:'Utilidad neta 100, flujo operativo 160 y capex 120: flujo libre aproximado 40. El año siguiente puede cambiar por inversiones extraordinarias; estudiá la tendencia, no solo un período.',source:'SEC — Beginners’ Guide to Financial Statements',url:'https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements'},
{title:'11. Ratios para analizar empresas: P/E, P/B, ROE y deuda',level:'Análisis de empresas',time:'45 min',desc:'Indicadores de valuación, rentabilidad y solvencia.',theory:`El ratio precio/ganancias (P/E o PER) divide precio por acción por ganancia por acción, o capitalización por resultado atribuible a accionistas. Un PER alto puede reflejar expectativas de crecimiento, baja percepción de riesgo o sobrevaluación; uno bajo puede señalar oportunidad o problemas estructurales. No es útil si las ganancias son negativas y puede distorsionarse por resultados extraordinarios.\n\nPrecio/valor libro (P/B) compara valor bursátil con patrimonio contable; puede aportar información en sectores financieros o intensivos en activos, pero es menos representativo cuando los principales activos son intangibles. ROE (resultado neto/patrimonio promedio) mide retorno contable sobre capital propio, aunque puede subir por alto apalancamiento o patrimonio reducido. ROIC intenta medir retorno sobre capital invertido y suele ser útil para evaluar si el negocio crea valor frente al costo de capital.\n\nDeuda neta/EBITDA compara deuda financiera neta con una aproximación de capacidad operativa, pero EBITDA no es efectivo disponible para pagar deuda. Cobertura de intereses mide la capacidad del resultado operativo para cubrir gastos financieros. Estos ratios varían mucho por industria; comparar una petrolera integrada con una empresa de software sin ajustar por modelo de negocio puede ser engañoso.`,points:['Usá múltiplos comparables y explicá por qué son comparables.','Normalizá ganancias por efectos extraordinarios y ciclo económico.','Interpretá ratios en conjunto, no como señales automáticas de compra.'],example:'Dos empresas tienen PER 8 y PER 20. La primera puede estar barata o enfrentar caída estructural; la segunda puede crecer más o estar cara. El número solo no resuelve el análisis.',source:'Damodaran Online — Valuation resources',url:'https://pages.stern.nyu.edu/~adamodar/'},
{title:'12. Bonos y obligaciones negociables',level:'Mercados',time:'35 min',desc:'Cupón, vencimiento, precio, rendimiento y riesgo de crédito.',theory:`Un bono es un instrumento de deuda: el emisor promete pagos según condiciones contractuales. Puede pagar cupones periódicos, amortizar capital en fechas determinadas y vencer al final de su vida. Las obligaciones negociables son deuda emitida por empresas bajo el marco regulatorio aplicable. Antes de invertir, hay que leer moneda, legislación, garantías, covenants, calendario de pagos, prioridad de cobro y condiciones de rescate.\n\nEl rendimiento al vencimiento es una medida que relaciona precio actual con los flujos prometidos, suponiendo que se cumplan y que los cupones se reinviertan a una tasa consistente. No es una rentabilidad garantizada: el emisor puede incumplir, el inversor puede vender antes del vencimiento y el precio de mercado puede variar. El riesgo de crédito y el riesgo de tasa son distintos, aunque interactúan.\n\nEn general, el precio de un bono de tasa fija se mueve en sentido inverso a las tasas de mercado. La duración aproxima sensibilidad a cambios de tasa; mayor duración implica mayor sensibilidad. En instrumentos argentinos deben analizarse además moneda, inflación, riesgo soberano o corporativo, liquidez, restricciones cambiarias y marco legal.`,points:['Leé prospecto, calificación y hechos relevantes; una calificación no elimina riesgo.','Compará rendimiento con moneda, plazo y calidad crediticia similares.','No confundas cupón con rendimiento total.'],example:'Un bono con cupón anual de 8% comprado por encima de su valor nominal puede rendir menos de 8% al vencimiento; el precio pagado importa tanto como el cupón.',source:'CNV — Mercado de capitales',url:'https://www.argentina.gob.ar/cnv/que-es-el-mercado-de-capitales'},
{title:'13. CEDEARs, ETF y diversificación internacional',level:'Mercados',time:'35 min',desc:'Acceso a activos extranjeros y riesgos asociados.',theory:`Los CEDEARs son certificados negociables en Argentina que representan valores del exterior conforme a una relación de conversión determinada. Su cotización local puede verse influida por el precio del activo subyacente, el tipo de cambio implícito, la relación de conversión, la liquidez y las condiciones del mercado local. No son equivalentes a comprar directamente la acción en su mercado de origen y hay que revisar comisiones, horarios y riesgos operativos.\n\nUn ETF es un fondo que cotiza en bolsa y puede replicar un índice, sector, bonos o una estrategia. Puede ofrecer diversificación con una sola operación, pero no todos los ETF son amplios o baratos: existen fondos concentrados, apalancados o inversos con riesgos particulares. Hay que revisar índice, metodología, gastos, concentración, moneda, domicilio del fondo y tracking error.\n\nDiversificar significa distribuir exposición entre emisores, sectores, clases de activos, regiones y factores de riesgo. Tener diez acciones tecnológicas no necesariamente diversifica. La correlación tiende a cambiar en crisis, así que la diversificación reduce ciertos riesgos pero no asegura una pérdida máxima ni una rentabilidad positiva.`,points:['Identificá el activo subyacente, moneda y relación de conversión.','En ETF, revisá índice, gastos y concentración de cartera.','No confundas cantidad de posiciones con diversificación efectiva.'],example:'Una cartera de acciones de energía, un fondo de bonos de corto plazo y liquidez para emergencias tienen fuentes de riesgo distintas; aun así, pueden verse afectados por shocks comunes.',source:'Bolsas y Mercados Argentinos (BYMA) — Educación financiera',url:'https://www.byma.com.ar/educacion'},
{title:'14. Fondos comunes de inversión',level:'Mercados',time:'25 min',desc:'Cuotapartes, rescate, horizonte y perfil de riesgo.',theory:`Un fondo común de inversión reúne aportes de múltiples cuotapartistas y los invierte siguiendo una política definida. El patrimonio se divide en cuotapartes; su valor cambia según los activos del fondo y sus gastos. Los fondos pueden tener exposición a instrumentos de mercado monetario, bonos, acciones, activos mixtos u otras estrategias permitidas. La denominación comercial no sustituye la lectura del reglamento de gestión.\n\nPara comparar fondos, observá objetivo, composición, duración de la cartera, moneda, riesgo de crédito, volatilidad, honorarios, plazos de rescate y benchmark cuando exista. Un rescate inmediato no es universal y puede haber horarios de corte o plazos operativos. El rendimiento pasado no garantiza resultados futuros y los fondos no deben suponerse garantizados salvo que exista una garantía expresa y jurídicamente válida.\n\nLa elección debe alinearse con el horizonte. Un fondo de liquidez diaria puede ser útil para administrar caja de corto plazo, mientras que un fondo de acciones puede tener caídas importantes y necesitar un horizonte largo. No elijas únicamente por el rendimiento de los últimos días.`,points:['Leé reglamento, cartera, honorarios y plazo de rescate.','Compará fondos con estrategias similares.','Evaluá rendimiento neto y riesgo asumido.'],example:'Dos fondos rindieron 4% el último mes; uno invierte en activos de corto plazo y otro en bonos largos y volátiles. El mismo resultado mensual no implica el mismo riesgo futuro.',source:'CNV — Fondos comunes de inversión',url:'https://www.argentina.gob.ar/cnv'},
{title:'15. Riesgo, perfil inversor y construcción de cartera',level:'Estrategia',time:'40 min',desc:'Definí una política de inversión antes de elegir activos.',theory:`El riesgo no es solo la volatilidad diaria: incluye pérdida permanente de capital, incumplimiento, falta de liquidez, inflación, tipo de cambio, concentración, cambios regulatorios y conducta del propio inversor. El perfil se construye combinando capacidad financiera para asumir pérdidas, necesidad de liquidez, horizonte y tolerancia psicológica. Una persona puede tolerar fluctuaciones pero no tener capacidad económica para soportar una caída antes de pagar una obligación próxima.\n\nUna política de inversión escrita define objetivos, horizonte, distribución objetivo por clases de activos, límites de concentración, necesidad de liquidez, reglas de rebalanceo y criterios de salida. La asignación de activos suele explicar gran parte de las características de riesgo de una cartera. Rebalancear significa volver a los pesos objetivo cuando se desvían; puede implicar costos e impuestos y no garantiza mejores resultados.\n\nEl análisis fundamental estima el valor económico de un activo mediante información del negocio y sus flujos. El análisis técnico estudia precio y volumen históricos para describir tendencias o patrones, pero no elimina incertidumbre ni reemplaza gestión de riesgo. Evitá confundir convicción con certeza y nunca inviertas dinero necesario para gastos esenciales en el corto plazo.`,points:['Definí pérdida máxima tolerable en términos financieros y emocionales.','Escribí criterios de compra, seguimiento y rebalanceo.','Revisá cartera por cambios de objetivos, no por cada titular diario.'],example:'Una cartera con objetivo de 60% renta variable y 40% renta fija puede desviarse después de una fuerte suba bursátil. Rebalancear devuelve el riesgo al objetivo, pero debe considerar costos y situación personal.',source:'CNV — Recomendaciones al inversor',url:'https://www.argentina.gob.ar/cnv/proteccion-al-inversor/recomendaciones-al-inversor'},
{title:'16. Cómo leer información pública y detectar señales de alerta',level:'Estrategia',time:'30 min',desc:'Fuentes primarias, prospectos, balances y estafas.',theory:`El análisis de inversiones debe apoyarse en información verificable. Para emisoras argentinas, consultá presentaciones regulatorias, estados contables, prospectos, calificaciones y hechos relevantes. Para empresas extranjeras, las presentaciones regulatorias del mercado de origen pueden complementar reportes corporativos. Una noticia resume; el documento primario permite comprobar cifras, definiciones y riesgos.\n\nSeñales de alerta incluyen promesas de rentabilidad garantizada extraordinaria, urgencia artificial para transferir dinero, intermediarios no registrados, falta de documentación, opacidad sobre costos y pagos que dependen de captar nuevos participantes. La regulación no elimina todo riesgo económico, pero verificar intermediarios y documentación ayuda a evitar fraudes.\n\nUna tesis de inversión debe incluir datos que podrían demostrar que estás equivocado. Si solo buscás información que confirma tu idea, aparece sesgo de confirmación. Registrá hipótesis, fuentes, fecha de consulta y escenarios alternativos. Separá hechos, estimaciones y opiniones.`,points:['Consultá registros oficiales antes de transferir fondos.','Desconfiá de rendimientos altos “sin riesgo”.','Registrá argumentos a favor y en contra de cada inversión.'],example:'Un video afirma que una acción “va a duplicarse”. Antes de decidir, buscá estados financieros, comunicados oficiales, valuación, liquidez y riesgos; si no hay evidencia verificable, no tomes el video como base suficiente.',source:'CNV — Recomendaciones al inversor',url:'https://www.argentina.gob.ar/cnv/proteccion-al-inversor/recomendaciones-al-inversor'}
];
const oilgas=[
{title:'1. Geografía petrolera de la Patagonia: cuencas y contexto',level:'Introducción',time:'30 min',desc:'Ubicá las principales cuencas y sus diferencias productivas.',theory:`La Patagonia reúne cuencas sedimentarias con historias geológicas, tipos de reservorio y perfiles productivos diferentes. La Cuenca del Golfo San Jorge, compartida principalmente por Chubut y Santa Cruz, es una cuenca madura históricamente asociada a petróleo convencional. Comodoro Rivadavia, el flanco norte de Santa Cruz y áreas como Cerro Dragón forman parte de su historia industrial. Muchos campos requieren gestión cuidadosa de presión, agua producida, integridad y recuperación secundaria o terciaria.\n\nLa Cuenca Neuquina se extiende por Neuquén y sectores de Río Negro, Mendoza y La Pampa. Incluye sistemas convencionales y recursos no convencionales como la formación Vaca Muerta, donde la combinación de roca generadora rica en materia orgánica, baja permeabilidad, perforación horizontal y estimulación hidráulica permite producir hidrocarburos que no fluirían económicamente con técnicas convencionales. La Cuenca Austral, en Santa Cruz y Tierra del Fuego, tiene una historia importante de gas y producción costa afuera y terrestre.\n\nNo debe confundirse una cuenca con un yacimiento: la cuenca es una región geológica extensa; un yacimiento es una acumulación concreta que puede desarrollarse con pozos e instalaciones. Tampoco todos los recursos técnicamente recuperables son reservas comerciales: la viabilidad depende de tecnología, costos, precios, regulación e infraestructura.`,points:['Golfo San Jorge: producción convencional madura y recuperación mejorada.','Neuquina: recursos convencionales y no convencionales, incluida Vaca Muerta.','Austral: fuerte componente gasífero y operaciones terrestres y offshore.'],example:'Comodoro Rivadavia creció ligado a la actividad petrolera del Golfo San Jorge; Añelo y localidades neuquinas se vinculan al desarrollo no convencional de la Cuenca Neuquina. Son contextos operativos distintos.',source:'Secretaría de Energía — Información sobre Vaca Muerta',url:'https://www.argentina.gob.ar/economia/energia/vaca-muerta'},
{title:'2. Cómo se forma un yacimiento de petróleo y gas',level:'Geología',time:'35 min',desc:'Roca generadora, migración, reservorio, sello y trampa.',theory:`Un sistema petrolero necesita que coincidan varios elementos y procesos geológicos. La roca generadora contiene materia orgánica que, enterrada y sometida durante millones de años a presión y temperatura adecuadas, puede transformarse en hidrocarburos. El petróleo y el gas pueden migrar desde esa roca hacia otras capas. Para acumularse, necesitan una roca reservorio con porosidad y permeabilidad suficientes y una configuración que permita retenerlos.\n\nLa porosidad representa el volumen de espacios vacíos de la roca; la permeabilidad describe la facilidad con la que los fluidos circulan a través de esos espacios conectados. Una roca puede tener porosidad alta pero baja permeabilidad. El sello, frecuentemente una roca de muy baja permeabilidad, limita la fuga de hidrocarburos. La trampa puede deberse a plegamientos, fallas o cambios estratigráficos. También importa el momento: la generación, migración y formación de la trampa deben ocurrir en una secuencia compatible.\n\nEn un reservorio convencional, el hidrocarburo migró y se acumuló en una roca reservorio. En sistemas no convencionales como Vaca Muerta, la roca generadora puede actuar también como reservorio, y la baja permeabilidad requiere pozos horizontales y estimulación. El modelo geológico se construye con sísmica, registros de pozo, testigos, análisis de laboratorio y datos de producción.`,points:['Generadora: origina hidrocarburos; reservorio: los almacena y permite flujo.','Sello y trampa contribuyen a conservar la acumulación.','La presencia de hidrocarburos no garantiza una reserva rentable.'],example:'Analogía: una esponja representa porosidad; los canales entre sus poros representan permeabilidad. Un recipiente cerrado ilustra la necesidad de una trampa y un sello, aunque la geología real es mucho más compleja.',source:'USGS — Petroleum systems',url:'https://www.usgs.gov/energy-and-minerals/energy-resources-program'},
{title:'3. Exploración: sísmica, geología y evaluación del subsuelo',level:'Geología',time:'35 min',desc:'Cómo se decide dónde perforar un pozo exploratorio.',theory:`La exploración integra datos indirectos y directos para reducir incertidumbre. La geología regional identifica cuencas, estructuras y ambientes sedimentarios. La sísmica utiliza ondas elásticas reflejadas en interfaces de propiedades distintas para construir imágenes del subsuelo; la interpretación busca geometrías, fallas, capas y posibles trampas. La sísmica no es una fotografía directa ni identifica petróleo con certeza: necesita calibración con pozos y un modelo geológico.\n\nLos registros de pozo miden propiedades físicas de las formaciones atravesadas, como resistividad, radioactividad natural, densidad o respuesta acústica. Los testigos permiten estudiar directamente roca, porosidad, mineralogía y contenido de fluidos. La presión, los ensayos de formación y las pruebas de producción aportan información adicional. El riesgo exploratorio incluye no encontrar una acumulación, encontrarla sin calidad suficiente o que no sea comercial.\n\nLos equipos multidisciplinarios construyen escenarios de volumen y probabilidad. Una decisión de perforar considera valor esperado, costo del pozo, infraestructura, permisos, sensibilidad ambiental y posibilidad de desarrollo posterior. La exploración es un proceso de aprendizaje: cada pozo, incluso seco, puede mejorar el modelo del área.`,points:['Sísmica: imagen indirecta de estructuras del subsuelo.','Registros, testigos y ensayos calibran la interpretación.','Exploración y desarrollo son etapas con riesgos y objetivos diferentes.'],example:'Una estructura atractiva en sísmica puede no contener hidrocarburos si falla uno de los elementos del sistema petrolero. Por eso se estima probabilidad geológica y económica antes de comprometer capital.',source:'Society of Exploration Geophysicists — Education',url:'https://seg.org/education/'},
{title:'4. Perforación: equipo, torre, BOP y circuito de lodo',level:'Operaciones',time:'40 min',desc:'Reconocé los principales componentes de un equipo perforador.',theory:`Un equipo de perforación crea un pozo que atraviesa las formaciones hasta alcanzar el objetivo geológico. La estructura de soporte, mástil o torre permite manejar tubulares; el sistema de izaje levanta y baja cargas; el sistema de rotación transmite movimiento a la sarta y a la herramienta de fondo; y el sistema de circulación bombea fluido de perforación por el interior de la sarta y lo devuelve por el espacio anular. Los equipos modernos pueden utilizar top drive, que facilita rotación y maniobras.\n\nEl fluido de perforación o lodo enfría y lubrica la broca, transporta recortes, ayuda a controlar presión y estabiliza el pozo. Su densidad y propiedades reológicas se ajustan al programa de perforación. En superficie, zarandas, desarenadores y otros equipos separan sólidos para acondicionar el fluido. La sarta puede incluir tubería, lastrabarrenas, herramientas de medición y componentes direccionales.\n\nEl preventor de reventones (BOP) forma parte del sistema de control de pozo y permite cerrar el pozo en condiciones previstas. El control de presión exige procedimientos, barreras verificadas, monitoreo de retornos y personal entrenado. Las tareas operativas deben realizarse según programas aprobados, normas del operador y requisitos de seguridad; este módulo es educativo, no una instrucción para operar equipos.`,points:['Izaje, rotación y circulación son sistemas centrales del equipo.','El lodo cumple funciones mecánicas e hidráulicas críticas.','BOP, barreras y procedimientos protegen el control del pozo.'],example:'Si el volumen de retorno cambia inesperadamente respecto del bombeo, el equipo debe seguir el procedimiento de control de pozo establecido. No se improvisa: se escala según roles, señales y protocolo.',source:'IADC — Drilling industry resources',url:'https://iadc.org/'},
{title:'5. Perforación convencional y no convencional: horizontal y fractura',level:'Operaciones',time:'35 min',desc:'Entendé por qué Vaca Muerta requiere otro diseño de pozo.',theory:`En muchos reservorios convencionales, el hidrocarburo puede fluir hacia un pozo vertical o direccional desde una roca con permeabilidad relativamente favorable. En formaciones de baja permeabilidad, como shale, el flujo natural suele ser insuficiente para producir a tasas económicas. Por eso se perfora una sección vertical, se curva la trayectoria y se construye un tramo horizontal dentro de la zona objetivo, aumentando el contacto con la formación.\n\nLa fractura hidráulica bombea un fluido a presión para crear o extender fracturas controladas en la roca; un agente de sostén ayuda a mantenerlas abiertas después de reducir la presión. El diseño considera geomecánica, etapas, espaciamiento, compatibilidad de fluidos, agua, logística y monitoreo. La operación requiere gestión rigurosa de integridad, agua, aditivos, retorno de fluidos, emisiones y residuos.\n\nLa productividad depende de la calidad de roca, longitud lateral, diseño de estimulación, espaciamiento entre pozos, presión y manejo de producción. No existe una receta universal: los parámetros se ajustan mediante datos, ensayos y aprendizaje de campañas anteriores. El análisis económico incluye costo por pozo, declinación, precio de venta, transporte, regalías y capex de instalaciones.`,points:['La perforación horizontal aumenta el contacto con la formación objetivo.','La fractura hidráulica mejora conectividad, pero implica gestión ambiental y de integridad.','La productividad se evalúa con curvas de declinación y recuperación acumulada.'],example:'Dos pozos en la misma formación pueden producir distinto por variación de calidad de roca, diseño, presión, longitud lateral y espaciamiento. La geología y la ingeniería deben leerse juntas.',source:'Secretaría de Energía — Vaca Muerta',url:'https://www.argentina.gob.ar/economia/energia/vaca-muerta'},
{title:'6. Producción: cómo suben el petróleo y el gas',level:'Operaciones',time:'35 min',desc:'Flujo natural, levantamiento artificial y sistemas de extracción.',theory:`Una vez completado el pozo, la producción depende de la energía del reservorio, las propiedades de los fluidos y las pérdidas de presión en el sistema. Algunos pozos producen inicialmente por energía natural; cuando la presión disminuye o el fluido no puede llegar a superficie a una tasa suficiente, se evalúan métodos de levantamiento artificial. La elección depende de profundidad, caudal, relación gas-líquido, sólidos, viscosidad, disponibilidad eléctrica y mantenimiento.\n\nEn el Golfo San Jorge es frecuente encontrar sistemas de bombeo mecánico, reconocibles por el balancín en superficie, aunque también existen otras tecnologías. La unidad de bombeo mueve una sarta de varillas conectada a una bomba de subsuelo. Las bombas electrosumergibles usan un motor eléctrico y etapas centrífugas instaladas en el pozo; el gas lift inyecta gas para reducir densidad de la columna de fluido; las bombas de cavidad progresiva pueden ser adecuadas para ciertos fluidos viscosos o con sólidos, bajo condiciones específicas.\n\nEl seguimiento incluye presión, caudal de petróleo, gas y agua, consumo energético, fallas, tiempos fuera de servicio y costos de intervención. La producción de agua puede aumentar a medida que madura un campo, y el manejo de agua producida se convierte en una parte importante de la operación. La tasa diaria por sí sola no define el valor de un pozo: importan la declinación, recuperación total y costos.`,points:['Bombeo mecánico: motor, transmisión, balancín, varillas y bomba de fondo.','Bomba electrosumergible: motor y bomba centrífuga en el pozo.','Medí producción de petróleo, agua y gas por separado.'],example:'En un campo maduro, el caudal de petróleo puede caer mientras sube el porcentaje de agua. La optimización busca mejorar producción económica y confiabilidad, no solo maximizar el volumen total de líquido.',source:'Petroleum Extension (PETEX), University of Texas at Austin',url:'https://petex.utexas.edu/'},
{title:'7. Maquinaria de campo: bombas, compresores, separadores y tanques',level:'Equipos',time:'40 min',desc:'Qué hace cada equipo en una locación productiva.',theory:`La instalación de producción recibe una mezcla de petróleo, gas, agua y sólidos desde los pozos. Los separadores aprovechan diferencias de densidad y condiciones de presión para dividir fases. Un separador bifásico separa gas y líquido; uno trifásico procura separar gas, petróleo y agua. La eficiencia depende de caudal, tiempo de residencia, temperatura, presión, emulsiones y diseño interno.\n\nLas bombas trasladan líquidos y agregan energía al flujo; se seleccionan según caudal, altura manométrica, viscosidad y propiedades del fluido. Los compresores elevan presión del gas para transporte, reinyección o procesamiento. Los tanques almacenan temporalmente líquidos y requieren medición, control de nivel, venteo seguro y protección contra sobrepresión o vacío según diseño. Las válvulas aíslan, regulan o protegen el sistema; los instrumentos miden presión, temperatura, nivel y caudal.\n\nEl mantenimiento puede ser preventivo, predictivo o correctivo. Vibraciones, temperatura, fugas, consumo eléctrico y tendencias de presión aportan señales para diagnosticar fallas. La integridad mecánica exige inspecciones, trazabilidad de reparaciones, materiales adecuados y gestión de corrosión. La seguridad depende de diseño, procedimientos, permisos de trabajo, aislamiento de energía y competencias del personal.`,points:['Separador: divide fases; no es un tanque de almacenamiento.','Bomba para líquidos y compresor para gases cumplen funciones distintas.','Instrumentación y válvulas permiten operar dentro de límites seguros.'],example:'Si aumenta la presión diferencial en un filtro, puede existir obstrucción. El diagnóstico real debe seguir el procedimiento y verificar instrumentación; no debe abrirse una línea presurizada sin aislamiento seguro.',source:'U.S. Department of Energy — Industrial technologies',url:'https://www.energy.gov/eere/amo/advanced-manufacturing-office'},
{title:'8. Instalaciones de superficie y tratamiento del crudo',level:'Producción',time:'35 min',desc:'Del pozo al crudo acondicionado para transportar.',theory:`El fluido que llega del pozo suele ser una mezcla multifásica. En baterías y plantas se separan gas, petróleo y agua, se controlan presión y temperatura y se acondiciona el crudo para cumplir especificaciones de transporte o venta. Según composición y diseño, pueden requerirse deshidratación, desalado, calentamiento, tratamiento de emulsiones, medición fiscal y estabilización.\n\nLas emulsiones se forman cuando gotas de agua quedan dispersas en el petróleo; pueden dificultar la separación y aumentar costos. Los tratadores usan combinación de calor, químicos, tiempo de residencia y, en ciertos diseños, campos eléctricos. El gas separado puede comprimirse, tratarse, utilizarse como combustible, reinyectarse o enviarse a una red, sujeto a especificaciones y disponibilidad. El agua producida requiere tratamiento y disposición o reutilización conforme a las reglas aplicables.\n\nLas instalaciones incluyen manifolds para dirigir flujos, colectores, líneas, válvulas, instrumentos, sistemas de protección y medición. La medición de hidrocarburos tiene importancia técnica y comercial: errores pueden afectar balances de producción, regalías y liquidaciones. La planificación considera corrosión, incrustaciones, hidratos, arena, fugas, electricidad estática y atmósferas inflamables.`,points:['La batería separa y mide flujos provenientes de pozos.','Deshidratación y tratamiento ayudan a cumplir especificaciones de crudo.','El agua producida y el gas requieren gestión técnica y ambiental.'],example:'Un crudo con alto contenido de agua puede incumplir especificaciones comerciales y encarecer transporte. La instalación debe separar fases y medir de forma trazable antes de transferir custodia.',source:'IAPG — Instituto Argentino del Petróleo y del Gas',url:'https://www.iapg.org.ar/'},
{title:'9. Recuperación secundaria y terciaria en campos maduros',level:'Yacimientos',time:'35 min',desc:'Cómo se sostiene o mejora la producción en campos convencionales.',theory:`La recuperación primaria aprovecha la energía natural del reservorio y los mecanismos de empuje disponibles. A medida que cae la presión o se agota la energía útil, la recuperación secundaria puede inyectar agua o gas para mantener presión y desplazar hidrocarburos hacia pozos productores. La efectividad depende de continuidad del reservorio, heterogeneidad, movilidad de fluidos, ubicación de pozos y control de inyección.\n\nLa recuperación terciaria o mejorada (EOR) incorpora métodos para modificar propiedades de fluidos o interacciones roca-fluido, por ejemplo inyección de polímeros, surfactantes, gases miscibles o procesos térmicos según el tipo de crudo y reservorio. En Cerro Dragón y otros campos del Golfo San Jorge, la recuperación mejorada y la gestión de campos maduros son temas relevantes para sostener producción. Cada proyecto requiere pruebas, evaluación económica, disponibilidad de agua o químicos y gestión ambiental.\n\nEl factor de recuperación es la proporción del hidrocarburo originalmente presente que se logra producir. Incrementarlo no depende de una sola técnica: requiere entender geología, presión, patrón de inyección, integridad de pozos, monitoreo y costos. Un barril adicional puede ser técnicamente posible pero no económico si el costo marginal supera su valor neto.`,points:['Secundaria suele buscar mantener presión y desplazar petróleo.','EOR intenta mejorar el desplazamiento o movilizar hidrocarburos residuales.','El desempeño debe evaluarse con datos de inyección y respuesta productiva.'],example:'Si una zona responde al agua inyectada con aumento de producción, puede indicar comunicación hidráulica favorable. Si el agua irrumpe demasiado rápido, puede requerir ajustar patrón o perfil de inyección.',source:'Society of Petroleum Engineers — Technical resources',url:'https://www.spe.org/en/industry/'},
{title:'10. Refinerías: del crudo a combustibles y derivados',level:'Refinación',time:'40 min',desc:'Destilación, conversión, tratamiento y productos finales.',theory:`Una refinería transforma petróleo crudo en productos con características comerciales y normativas. El primer gran proceso suele ser la destilación atmosférica: al calentar el crudo, los componentes se separan en fracciones según sus rangos de ebullición. Las fracciones ligeras pueden incluir gases y naftas; otras corrientes incluyen queroseno, gasoil y residuos más pesados. La destilación separa, pero no convierte por sí sola moléculas pesadas en productos ligeros de mayor valor.\n\nLos procesos de conversión modifican moléculas: el craqueo catalítico o hidrocracking puede producir componentes más ligeros; el reformado catalítico mejora características de ciertas naftas; la coquización procesa residuos pesados. Los procesos de tratamiento, como hidrodesulfuración, reducen azufre y otros contaminantes para cumplir especificaciones y mejorar desempeño ambiental. Las refinerías combinan unidades, intercambiadores de calor, hornos, columnas, bombas, compresores, tanques, antorchas y sistemas de seguridad.\n\nEl rendimiento de productos depende de la calidad del crudo, configuración de la refinería, demanda y restricciones operativas. El margen de refinación no es simplemente precio de venta menos precio del barril: incluye rendimientos, costos energéticos, logística, mantenimiento, paradas, calidad de productos y otros gastos. La seguridad de procesos es crítica por la presencia de hidrocarburos inflamables, altas temperaturas, presiones y sustancias peligrosas.`,points:['Destilación separa fracciones; conversión transforma moléculas.','Tratamiento reduce contaminantes y permite cumplir especificaciones.','El margen depende del mix de productos, costos y configuración industrial.'],example:'Dos crudos distintos pueden generar rendimientos diferentes de nafta, gasoil y residuos. Una refinería compleja puede procesar ciertos crudos pesados con más conversión, pero esa capacidad requiere inversión y mantenimiento.',source:'U.S. Energy Information Administration — Refining crude oil',url:'https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil.php'},
{title:'11. Transporte: oleoductos, gasoductos, terminales y buques',level:'Midstream',time:'30 min',desc:'Cómo se conecta la producción con las refinerías y los mercados.',theory:`La cadena midstream conecta los pozos con plantas de procesamiento, refinerías, terminales y consumidores. El petróleo puede transportarse por oleoductos, camiones o buques; el gas necesita redes de gasoductos, compresión y, para exportación marítima en forma de GNL, instalaciones de licuefacción y terminales especializadas. Cada alternativa tiene restricciones de capacidad, presión, distancia, clima, seguridad y costo.\n\nLos oleoductos operan con estaciones de bombeo, válvulas de seccionamiento, medición y sistemas de detección de fugas. Los gasoductos usan compresión y control de presión; el transporte de gas depende de composición y especificaciones. Las terminales marítimas incluyen tanques, sistemas de carga, medición y planes de respuesta a emergencias. La capacidad de evacuación puede convertirse en cuello de botella: un yacimiento productivo no genera valor pleno si no puede transportar el hidrocarburo a mercado.\n\nEn Argentina, proyectos de evacuación de la Cuenca Neuquina y terminales de exportación se relacionan con el crecimiento de Vaca Muerta y el objetivo de aumentar exportaciones. La infraestructura necesita permisos, financiación, contratos, coordinación de cronogramas y evaluación de impactos ambientales y sociales.`,points:['Upstream produce; midstream transporta y procesa; downstream refina y comercializa.','La capacidad de evacuación influye en el desarrollo económico del yacimiento.','La integridad de ductos y la detección de fugas son prioridades de seguridad.'],example:'Si la producción crece más rápido que la capacidad de un oleoducto, pueden aparecer restricciones, almacenamiento adicional o necesidad de transporte alternativo, todos con efecto sobre el costo neto recibido.',source:'TGS — Comunicados e infraestructura de gas',url:'https://www.tgs.com.ar/prensa/'},
{title:'12. Economía petrolera: costos, reservas y declinación',level:'Negocio',time:'40 min',desc:'Cómo se evalúa si un pozo o proyecto crea valor.',theory:`La evaluación económica de un proyecto petrolero estima flujos de caja futuros: ingresos por producción vendida menos costos operativos, inversiones, transporte, regalías, impuestos y abandono, según el alcance del análisis. Los flujos futuros se descuentan para considerar el valor temporal del dinero y el riesgo. El Valor Actual Neto (VAN) suma flujos descontados; un VAN positivo bajo supuestos consistentes indica creación de valor respecto de la tasa de descuento usada, no certeza de resultados. La Tasa Interna de Retorno (TIR) es la tasa que hace VAN igual a cero, pero puede ser engañosa en flujos no convencionales o al comparar proyectos de distinto tamaño.\n\nLas reservas son volúmenes recuperables bajo condiciones definidas de tecnología, economía y proyecto; no equivalen a todo el petróleo existente ni a recursos técnicamente recuperables. Las curvas de declinación describen cómo cambia la producción de un pozo con el tiempo y se usan para estimar recuperación futura, aunque la extrapolación debe considerar cambios operativos y límites físicos. El precio realizado puede diferir del precio de referencia por calidad, transporte, descuentos y contratos.\n\nLos análisis de sensibilidad prueban cambios en precio, caudal, inversión, costos, tipo de cambio, impuestos y plazo. Un proyecto puede tener VAN positivo en escenario base y negativo ante una caída de precio. La decisión responsable muestra rangos y riesgos, no una única cifra precisa sin contexto.`,points:['Separá recursos, reservas y producción acumulada.','Modelá flujos de caja y costos de abandono.','Probá escenarios de precio, productividad, costos y retrasos.'],example:'Un pozo barato con declinación muy rápida puede generar menos valor que uno más costoso con producción sostenible. El criterio es el flujo neto esperado ajustado por riesgo, no solo el costo inicial.',source:'SPE — Petroleum Resources Management System',url:'https://www.spe.org/en/industry/petroleum-resources-management-system-2018/'},
{title:'13. Seguridad, ambiente e integridad operativa en Patagonia',level:'HSE',time:'35 min',desc:'Barreras, permisos, agua, emisiones y prevención.',theory:`Las operaciones petroleras combinan riesgos de proceso, mecánicos, eléctricos, químicos, ergonómicos y ambientales. La prevención efectiva se basa en identificar peligros, evaluar riesgos, establecer barreras, verificar su funcionamiento y aprender de incidentes y casi incidentes. Los permisos de trabajo, aislamiento y bloqueo de energías, detección de gases, control de espacios confinados y gestión de contratistas forman parte de sistemas de trabajo seguro. La seguridad no se reduce al uso de elementos de protección personal: requiere diseño, planificación y supervisión.\n\nLa integridad de pozos y ductos incluye diseño, materiales, inspección, control de corrosión, pruebas y gestión de cambios. En yacimientos maduros, la condición de pozos inactivos y abandonados necesita seguimiento y cierre conforme a requisitos. La gestión ambiental incluye agua de operación y agua producida, residuos, emisiones, ruido, suelo, biodiversidad, contingencias y relación con comunidades. Las medidas deben responder al contexto específico y a la normativa vigente.\n\nEn Patagonia, la distancia entre locaciones, el viento, el frío, la nieve en algunas zonas y la logística remota pueden aumentar el riesgo operacional. La planificación contempla comunicaciones, transporte, fatiga, disponibilidad de repuestos y respuesta ante emergencias. Este contenido es introductorio: los trabajos reales deben realizarse con procedimientos aprobados, capacitación y supervisión competente.`,points:['Identificá peligros y barreras antes de iniciar una tarea.','La integridad se gestiona durante todo el ciclo de vida del activo.','Adaptá planes a clima, distancia, comunidad y sensibilidad ambiental local.'],example:'Antes de intervenir una bomba, el equipo debe aplicar el procedimiento de aislamiento de energías, verificar estado seguro y coordinar el permiso de trabajo. Nunca se debe intervenir por intuición o solo por haber apagado un interruptor.',source:'IAPG — Seguridad y ambiente',url:'https://www.iapg.org.ar/'},
{title:'14. Mapa de la cadena de valor petrolera argentina',level:'Negocio',time:'25 min',desc:'Operadoras, contratistas, servicios, refinerías y comercialización.',theory:`La industria se organiza en actividades conectadas. Upstream incluye exploración, desarrollo y producción. Midstream reúne recolección, procesamiento, transporte y almacenamiento. Downstream comprende refinación, distribución y comercialización de combustibles y otros derivados. Empresas integradas participan en más de un segmento; otras se especializan en perforación, cementación, wireline, estimulación, mantenimiento, ingeniería, transporte o servicios ambientales.\n\nLa operadora gestiona el proyecto, los activos y las decisiones de inversión, mientras que contratistas especializados aportan equipos, personal y tecnología bajo contratos y requisitos operativos. El desempeño depende de coordinación, disponibilidad de equipos, productividad, calidad, seguridad, costos y cumplimiento contractual. En las cuencas patagónicas, la actividad genera demanda de logística, talleres, alojamiento, transporte, metalmecánica y servicios profesionales, además del empleo directo.\n\nLos indicadores deben interpretarse por segmento. Producción diaria, lifting cost, utilización de equipos, metros perforados por día, costo por pozo, disponibilidad mecánica, tasa de incidentes, margen de refinación y capacidad de ductos miden aspectos diferentes. Comparar empresas requiere ajustar por tipo de activo, madurez, mix de producto y alcance operativo.`,points:['Identificá qué parte de la cadena realiza cada empresa.','Distinguí operador, contratista y proveedor de equipos.','Elegí indicadores acordes al segmento y al modelo de negocio.'],example:'Un equipo perforador puede estar disponible técnicamente, pero sin personal, insumos o permisos no produce metros. La productividad resulta de coordinar activos, planificación, logística y seguridad.',source:'IAPG — Instituto Argentino del Petróleo y del Gas',url:'https://www.iapg.org.ar/'}
];
const english=[
{title:'1. Building clear sentences',level:'A1',time:'20 min',desc:'Subject, verb, object and word order.',theory:'English typically uses Subject + Verb + Object: “The engineer checks the pump.” Spanish allows more flexible word order and often omits the subject, but English normally requires an explicit subject. Adjectives usually come before nouns: “a reliable system”, not “a system reliable”. In technical writing, prefer short sentences with one main idea.',spanish:'En inglés, el orden suele ser sujeto + verbo + objeto. No omitas el sujeto como en español. Los adjetivos van antes del sustantivo.',vocab:'subject = sujeto · verb = verbo · object = objeto · equipment = equipo · reliable = confiable',example:'The technician inspects the valve. / The company produces crude oil.',source:'British Council — A1-A2 grammar',url:'https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar'},
{title:'2. The verb “to be”',level:'A1',time:'20 min',desc:'Identity, roles, states and descriptions.',theory:'“To be” forms are am, is and are in the present. Use am with I, is with he/she/it and are with you/we/they. Negatives add not; questions invert the verb and subject. “The plant is operational” describes a state; “The engineer is in the control room” describes location.',spanish:'I am, you are, he/she/it is, we are, they are. En preguntas: “Is the pump running?” En negativas: “The pump is not ready.”',vocab:'available = disponible · safe = seguro · ready = listo · responsible for = responsable de',example:'The valves are closed. / Is the compressor available? / The system is not stable.',source:'British Council — Verb to be',url:'https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar'},
{title:'3. Present Simple for routines and facts',level:'A1',time:'25 min',desc:'Operating routines, schedules and general truths.',theory:'Use the present simple for routines, repeated actions and general facts. Add -s or -es with he, she and it: “The pump starts automatically.” Questions use do/does; negatives use do not/does not + base verb. Frequency adverbs usually go before the main verb, but after “to be”.',spanish:'Se usa para rutinas y hechos generales. “The plant operates 24 hours a day.” Para preguntas: “Does the system record pressure?”',vocab:'usually = generalmente · daily = diariamente · measure = medir · maintain = mantener',example:'Operators check the pressure every shift. / The sensor does not detect gas.',source:'British Council — Present simple',url:'https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar/present-simple'},
{title:'4. Present Continuous',level:'A2',time:'25 min',desc:'Actions happening now and temporary situations.',theory:'Form: am/is/are + verb-ing. It describes an action in progress or a temporary situation: “The team is testing the equipment.” Do not use it automatically for every present-tense sentence; state verbs such as know, believe and own are usually not continuous in their ordinary meanings.',spanish:'Se usa para acciones en curso o situaciones temporales. “We are reviewing the financial report.” Contrasta con presente simple: “We review reports every month.”',vocab:'currently = actualmente · testing = probando · reviewing = revisando · improving = mejorando',example:'The technicians are replacing a valve today. / Production is increasing this week.',source:'British Council — Present continuous',url:'https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar/present-continuous'},
{title:'5. Past Simple: incidents and completed work',level:'A2',time:'25 min',desc:'Report events, maintenance and historical results.',theory:'Use the past simple for completed actions at a finished time. Regular verbs usually add -ed; irregular verbs have a separate form. Questions use did + base verb. In incident reports, specify what happened, when it happened, what was observed and what action followed. Avoid ambiguous time expressions.',spanish:'“The pump stopped at 10:30.” Para preguntas: “Did the operator report the leak?” Después de did, el verbo vuelve a su forma base.',vocab:'occurred = ocurrió · failed = falló · repaired = reparó/reparado · reported = informó',example:'The team identified the fault and replaced the damaged sensor yesterday.',source:'British Council — Past simple',url:'https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar/past-simple'},
{title:'6. Present Perfect: experience and results',level:'B1',time:'30 min',desc:'Connect past events with the present.',theory:'Form: have/has + past participle. Use it for experience without a specific finished time, a past action with present relevance, or a situation continuing until now. Use the past simple with a finished time such as yesterday or in 2024. “We have completed the inspection” emphasizes the current result; “We completed it on Monday” specifies the finished time.',spanish:'El present perfect conecta pasado y presente. No suele combinarse con “yesterday” o “last year” cuando se indica un momento terminado.',vocab:'completed = completado · since = desde · for = durante/hace · experience = experiencia',example:'The company has operated in the basin for twenty years. / We completed the audit last Friday.',source:'British Council — Present perfect',url:'https://learnenglish.britishcouncil.org/grammar/b1-b2-grammar/present-perfect'},
{title:'7. Future forms: will, going to and present continuous',level:'B1',time:'30 min',desc:'Forecasts, plans and scheduled arrangements.',theory:'Use will for predictions, spontaneous decisions and offers; be going to for intentions and predictions based on present evidence; and present continuous for arranged future events. These are tendencies, not absolute rules. In professional communication, state dates, owners and dependencies explicitly to reduce ambiguity.',spanish:'“We will review the results” puede expresar una decisión o previsión. “We are going to replace the pump” comunica un plan. “We are meeting the supplier on Tuesday” indica un arreglo acordado.',vocab:'forecast = pronóstico · schedule = cronograma · deadline = fecha límite · arrange = coordinar',example:'The supplier is delivering the parts tomorrow. / We are going to upgrade the database next quarter.',source:'British Council — Talking about the future',url:'https://learnenglish.britishcouncil.org/grammar/b1-b2-grammar/future-forms'},
{title:'8. Questions, negatives and indirect questions',level:'A2',time:'25 min',desc:'Ask precise questions in meetings and reports.',theory:'Auxiliary verbs make questions and negatives. Use do/does/did with many main verbs, be with its own inversion, and modal verbs before the subject. Indirect questions are more polite and use statement word order after the opening phrase: “Could you tell me where the report is?” not “where is the report”.',spanish:'En preguntas indirectas no se invierte el sujeto y el verbo en la cláusula interna. “Do you know when the shipment arrives?”',vocab:'Could you clarify…? = ¿Podría aclarar…? · whether = si · issue = asunto/problema · requirement = requisito',example:'Direct: Where is the safety report? Indirect: Could you tell me where the safety report is?',source:'British Council — Questions',url:'https://learnenglish.britishcouncil.org/grammar'},
{title:'9. Modal verbs: can, could, should, must and have to',level:'B1',time:'25 min',desc:'Ability, advice, obligation and permission.',theory:'Modal verbs are followed by the base form: “The team must verify the pressure.” Must often expresses strong obligation or speaker authority; have to often describes an external requirement. Should gives advice, can ability or permission, and could a possibility or polite request. “Must not” means prohibited; “do not have to” means not necessary. This distinction is critical in procedures.',spanish:'Must not = no se debe / está prohibido. Do not have to = no es necesario. No significan lo mismo.',vocab:'must = obligación fuerte · should = debería · permitted = permitido · required = requerido',example:'Workers must wear the required PPE. / You do not have to submit the draft today.',source:'British Council — Modals',url:'https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/modal-verbs'},
{title:'10. Prepositions of time and place',level:'A2',time:'20 min',desc:'Write accurate dates, locations and operating conditions.',theory:'Use at for specific clock times and points, on for days and dates, and in for months, years and longer periods. For place, at can indicate a point, in an enclosed area or region, and on a surface. Technical expressions sometimes use fixed combinations, so learn them as phrases: responsible for, interested in, depend on, comply with.',spanish:'At 8:00, on Monday, in October. “The valve is on the pipeline”; “The team is in the control room.”',vocab:'at = en (hora/punto) · on = sobre/en (día/superficie) · in = en (período/espacio) · comply with = cumplir con',example:'The inspection is scheduled for 14 October at 9:00 a.m. The equipment is in the warehouse.',source:'British Council — Prepositions',url:'https://learnenglish.britishcouncil.org/grammar'},
{title:'11. Articles, countable and uncountable nouns',level:'B1',time:'25 min',desc:'Use a, an, the and zero article correctly.',theory:'Use a/an with a singular countable noun when introducing one non-specific item; use the when the reference is specific or already known. Many uncountable nouns do not take a/an: information, equipment, advice and research. Use “a piece of information” or “a piece of equipment” when counting units. In technical English, incorrect countability often makes sentences sound unnatural.',spanish:'“Equipment” e “information” son incontables en inglés estándar: no digas “equipments” o “informations”.',vocab:'equipment = equipamiento · advice = consejo(s) · information = información · a unit of = una unidad de',example:'We installed a sensor. The sensor measures pressure. The equipment is ready.',source:'British Council — Articles and nouns',url:'https://learnenglish.britishcouncil.org/grammar'},
{title:'12. Comparatives, superlatives and quantitative language',level:'B1',time:'25 min',desc:'Compare costs, performance, production and risk.',theory:'Short adjectives often use -er/-est; longer adjectives use more/most. Irregular forms include good/better/best and bad/worse/worst. For data analysis, comparisons need a consistent basis: per unit, per barrel, per employee or per period. Use “higher than”, “lower than”, “approximately”, “by 12%” and “compared with” precisely.',spanish:'“Production was 12% higher than in the previous quarter.” Aclarar siempre el período y la unidad evita conclusiones engañosas.',vocab:'higher/lower = mayor/menor · roughly = aproximadamente · whereas = mientras que · compared with = comparado con',example:'Operating costs per barrel were lower in Q2, whereas total costs increased because production volumes were higher.',source:'British Council — Comparative and superlative adjectives',url:'https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar/comparative-superlative-adjectives'},
{title:'13. Passive voice in technical reports',level:'B2',time:'30 min',desc:'Describe processes and results without overemphasizing the actor.',theory:'Passive voice is formed with be + past participle. It is useful when the process or result matters more than who performs it: “The sample was analyzed in the laboratory.” The agent can be included with by when relevant. Avoid using passive voice to hide accountability in incident reports; identify the responsible role when the information is material.',spanish:'La voz pasiva pone el foco en el objeto o proceso. “The valve was replaced by the maintenance team.”',vocab:'was measured = fue medido · was approved = fue aprobado · is required = es requerido · by = por',example:'The data were collected during the test and were reviewed by the engineering team.',source:'British Council — Passives',url:'https://learnenglish.britishcouncil.org/grammar/b1-b2-grammar/passives'},
{title:'14. Conditionals, risk and cause-and-effect',level:'B2',time:'30 min',desc:'Explain scenarios, assumptions and consequences.',theory:'Zero conditional describes general rules: if + present, present. First conditional describes realistic future possibilities: if + present, will + base verb. Second conditional explores hypothetical situations: if + past, would + base verb. In risk and finance writing, make assumptions explicit and avoid presenting scenarios as certainties. Use because, therefore, consequently and as a result to connect cause and effect.',spanish:'“If the pressure exceeds the limit, the system shuts down” describe una regla. “If prices fall, margins may decrease” presenta una posibilidad.',vocab:'if = si · unless = a menos que · therefore = por lo tanto · may result in = puede resultar en',example:'If the project is delayed, costs may increase. Therefore, the team is reviewing the critical path.',source:'British Council — Conditionals',url:'https://learnenglish.britishcouncil.org/grammar/b1-b2-grammar/conditionals'},
{title:'15. Linking words for reports and executive summaries',level:'B2',time:'25 min',desc:'Build logical, concise and evidence-based arguments.',theory:'Linking expressions show addition (furthermore), contrast (however), cause (because), result (therefore), concession (although) and sequence (first, subsequently). A strong report states the finding, supports it with evidence, explains implications and identifies limitations. Avoid overusing connectors: logical structure matters more than decorative language.',spanish:'En un resumen ejecutivo, empezá por la conclusión principal; luego incluí dos o tres evidencias, implicancias y próximos pasos.',vocab:'however = sin embargo · furthermore = además · consequently = en consecuencia · despite = a pesar de',example:'Revenue increased by 8%. However, operating margin declined because input costs rose faster than sales.',source:'Purdue OWL — Professional and technical writing',url:'https://owl.purdue.edu/owl/subject_specific_writing/professional_technical_writing/index.html'},
{title:'16. Professional emails and requests',level:'B2',time:'30 min',desc:'Subject lines, tone, action requests and follow-up.',theory:'A professional email has a meaningful subject, brief context, a clear request, a deadline if needed, and a courteous closing. Put the requested action near the top. Use “Could you please…?” for polite requests and specify attachments or document versions. Avoid vague phrases such as “as soon as possible” when a real deadline matters.',spanish:'Un correo eficaz permite que el destinatario entienda qué necesitás, por qué, para cuándo y qué archivo o decisión debe revisar.',vocab:'Please find attached = adjunto encontrará · follow up = hacer seguimiento · by close of business = al cierre de la jornada',example:'Subject: Review required — September production report. Could you please review the attached report and send your comments by Thursday, 15:00?',source:'Purdue OWL — Email etiquette',url:'https://owl.purdue.edu/owl/general_writing/academic_writing/email_etiquette.html'},
{title:'17. Meetings, presentations and disagreement',level:'B2',time:'30 min',desc:'Participate clearly and professionally.',theory:'Useful meeting language includes “Could we clarify the objective?”, “From my perspective…”, “The data suggest…” and “I see your point; however…”. Distinguish facts from interpretations, summarize decisions and assign an owner and due date to each action. When presenting data, explain the metric, period, unit and comparison before interpreting the chart.',spanish:'Para discrepar profesionalmente, cuestioná la evidencia o el supuesto, no a la persona. Cerrá con una alternativa o una pregunta concreta.',vocab:'agenda = orden del día · minutes = acta · action item = tarea acordada · key takeaway = conclusión principal',example:'The chart shows a 6% decline quarter over quarter. Before attributing it to price, we should compare volume, product mix and downtime.',source:'British Council — Business English',url:'https://learnenglish.britishcouncil.org/business-english'},
{title:'18. Finance English: income statement',level:'B2',time:'30 min',desc:'Revenue, gross profit, operating income and net income.',theory:'An income statement reports financial performance over a period. Revenue is income from ordinary activities; cost of goods sold or cost of sales represents direct costs associated with sales. Gross profit equals revenue minus cost of sales. Operating expenses include costs such as selling, general and administrative expenses. Operating income is measured before financing costs and taxes under common presentations; net income is the bottom-line result after applicable items.',spanish:'Revenue = ingresos por ventas; gross profit = ganancia bruta; operating expenses = gastos operativos; net income = resultado neto. Las definiciones exactas dependen del marco contable.',vocab:'revenue = ingresos · expenses = gastos · margin = margen · earnings = ganancias/resultados',example:'Revenue increased, but the gross margin fell from 28% to 24% because input costs rose.',source:'SEC — Beginner’s Guide to Financial Statements',url:'https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements'},
